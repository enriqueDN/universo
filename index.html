<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Para ti corazón❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Playfair Display', serif;
      touch-action: none;
    }

    canvas {
      display: block;
    }

    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #2a0000 0%, #000000 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3000;
      color: #ff3333;
      font-size: 2rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 1s ease;
      text-shadow: 0 0 15px #ff0000;
      flex-direction: column;
    }

    #start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .pulse-text {
      animation: pulse 1.5s infinite alternate;
      letter-spacing: 0.5px;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }

      100% {
        transform: scale(1.1);
        opacity: 1;
      }
    }

    .start-heart {
      margin-top: 18px;
      width: 200px;
      height: auto;
      border-radius: 10px;
      animation: startHeartBeat 1.1s ease-in-out infinite;
    }

    @keyframes startHeartBeat {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.18);
      }
    }

    @media (max-width: 480px) {
      .start-heart {
        width: 80px;
        margin-top: 12px;
      }
    }

    #top-title {
      position: fixed;
      top: 15%;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 1500;
      pointer-events: none;
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 2.6rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ff4d4d, #ff0000, #cc0000);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 14px rgba(255, 0, 0, 0.7));
      animation: titlePulse 1.6s ease-in-out infinite;
    }

    #image-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 4000;
      transition: opacity 0.4s;
      backdrop-filter: blur(5px);
    }

    .modal-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .modal-content {
      background: linear-gradient(145deg, #1a0000, #000000);
      border: 2px solid #ff0000;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.4);
      padding: 25px;
      border-radius: 15px;
      max-width: 90%;
      width: 400px;
      text-align: center;
      position: relative;
      color: white;
    }

    #modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 28px;
      cursor: pointer;
      color: #ff4d4d;
    }

    .modal-img-container {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
      border: 1px solid #330000;
    }

    #modal-img {
      width: 100%;
      display: block;
    }

    #modal-title {
      margin: 10px 0;
      font-size: 1.5rem;
      color: #ff3333;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
    }

    #modal-text {
      font-size: 1rem;
      line-height: 1.4;
      color: #cccccc;
      margin-bottom: 20px;
    }

    #modal-btn-close {
      background: transparent;
      border: 1px solid #ff0000;
      color: white;
      padding: 10px 25px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.3s;
      font-family: 'Playfair Display', serif;
    }

    #modal-btn-close:hover {
      background: #ff0000;
      box-shadow: 0 0 15px #ff0000;
    }

    @keyframes titlePulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.04);
      }
    }

    @media (max-width: 480px) {
      #top-title {
        font-size: 1.7rem;
        top: 15% !important;
      }
    }
  </style>
</head>

<body>

  <div id="start-screen">
    <div class="pulse-text">Toca para ver lo demas</div>
    <img class="start-heart" src="fondo1.gif" alt="Iniciar">
  </div>

  <div id="top-title">TE AMO EN TODOS LOS UNIVERSOS❤️</div>

  <canvas id="c"></canvas>

  <div id="image-modal" class="modal-hidden">
    <div class="modal-content">
      <div id="modal-close">&times;</div>
      <div class="modal-img-container">
        <img id="modal-img" src="" alt="Recuerdo">
      </div>
      <h2 id="modal-title">Un momento especial</h2>
      <p id="modal-text">Aquí va la descripción de tu foto.</p>
      <button id="modal-btn-close">CERRAR ❤️</button>
    </div>
  </div>

  <audio id="audio" loop preload="auto">
    <source src="../assets/fondo-cancion.mp3" type="audio/mpeg">
  </audio>

  <script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>
  <script>
    const startScreen = document.getElementById('start-screen');
    const audio = document.getElementById('audio');
    audio.preload = 'auto';
    audio.load();

    let experienceStarted = false;
    function unlockAudioAndStart() {
      if (experienceStarted) return;
      experienceStarted = true;
      const playPromise = audio.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(err => console.log("Audio no autoplay:", err));
      }
      startScreen.classList.add('hidden');
    }
    startScreen.addEventListener('touchend', (e) => {
      e.preventDefault();
      unlockAudioAndStart();
    }, { passive: false });
    startScreen.addEventListener('click', unlockAudioAndStart);

    const isMobile = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent) || window.innerWidth <= 820;

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2));
    renderer.setSize(innerWidth, innerHeight);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 5000);

    let targetDist = 400, currentDist = 400;
    let rotX = 0.2;
    let rotY = 0;

    const loader = new THREE.TextureLoader();
    const nebulaTex = loader.load('https://threejs.org/examples/textures/cube/space/px.jpg');
    scene.background = nebulaTex;

    function makeDotTexture() {
      const size = 64;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grad.addColorStop(0.0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.55, 'rgba(255,255,255,1)');
      grad.addColorStop(0.85, 'rgba(255,255,255,0.55)');
      grad.addColorStop(1.0, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }
    const dotTexture = makeDotTexture();

    (function makeStars(count = isMobile ? 1400 : 2200, spread = 3000) {
      const g = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const r = spread * (0.3 + Math.random() * 0.7);
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        pos[i * 3 + 0] = r * Math.sin(ph) * Math.cos(th);
        pos[i * 3 + 1] = r * Math.cos(ph);
        pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
      }
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      scene.add(new THREE.Points(g, new THREE.PointsMaterial({
        size: 2.2,
        sizeAttenuation: false,
        map: dotTexture,
        transparent: true,
        alphaTest: 0.01,
        depthWrite: false,
        opacity: 0.9,
        color: 0xffcccc
      })));
    })();

    function heartCurve(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return { x, y };
    }

    const HEART_SCALE = 3.2;
    const HEART_THICKNESS = 3.4;
    const HEART_DEPTH = 8.5;
    const HEART_Y_OFFSET = 6;

    const heartPoints = [];
    const HEART_COUNT = isMobile ? 4400 : 5800;
    for (let i = 0; i < HEART_COUNT; i++) {
      const t = Math.random() * Math.PI * 2;
      const p0 = heartCurve(t);
      const p1 = heartCurve(t + 0.001);
      const tx = p1.x - p0.x, ty = p1.y - p0.y;
      const tLen = Math.hypot(tx, ty) || 1;
      const nx = -ty / tLen, ny = tx / tLen;
      const offset = (Math.random() - 0.5) * HEART_THICKNESS;

      const rawX = p0.x + nx * offset;
      const rawY = p0.y + ny * offset + HEART_Y_OFFSET;

      heartPoints.push(new THREE.Vector3(
        rawX * HEART_SCALE,
        rawY * HEART_SCALE,
        (Math.random() - 0.5) * HEART_DEPTH
      ));
    }
    const heartGeom = new THREE.BufferGeometry().setFromPoints(heartPoints);
    const heartMat = new THREE.PointsMaterial({
      color: 0xff0000,
      size: 1.2,
      map: dotTexture,
      transparent: true,
      alphaTest: 0.01,
      depthWrite: false,
      opacity: 0.95,
      blending: THREE.AdditiveBlending
    });
    const heart = new THREE.Points(heartGeom, heartMat);
    scene.add(heart);

    const spiralPoints = [];
    const arms = 4;
    const SPIRAL_COUNT = isMobile ? 3400 : 5200;
    for (let i = 0; i < SPIRAL_COUNT; i++) {
      const r = Math.random() * 250;
      const armIndex = Math.floor(Math.random() * arms);
      const theta = (armIndex * Math.PI * 2 / arms) + (r * 0.02) + (Math.random() * 0.4 - 0.2);
      const sx = Math.cos(theta) * r;
      const sz = Math.sin(theta) * r;
      const sy = -35 - (r * 0.4) + (Math.random() * 8 - 4);
      spiralPoints.push(new THREE.Vector3(sx, sy, sz));
    }
    const spiralGeom = new THREE.BufferGeometry().setFromPoints(spiralPoints);
    const spiralMat = new THREE.PointsMaterial({
      color: 0xcc0000,
      size: 1.2,
      map: dotTexture,
      transparent: true,
      alphaTest: 0.01,
      depthWrite: false,
      opacity: 0.95,
      blending: THREE.AdditiveBlending
    });
    const spiral = new THREE.Points(spiralGeom, spiralMat);
    scene.add(spiral);

    const DUST_INNER_R = 150;
    const DUST_OUTER_R = 380;
    const dustPoints = [];
    const DUST_COUNT = isMobile ? 7000 : 14000;
    for (let i = 0; i < DUST_COUNT; i++) {
      const r = DUST_INNER_R + Math.random() * (DUST_OUTER_R - DUST_INNER_R);
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      dustPoints.push(new THREE.Vector3(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi),
        r * Math.sin(phi) * Math.sin(theta)
      ));
    }
    const dustGeom = new THREE.BufferGeometry().setFromPoints(dustPoints);
    const dustMat = new THREE.PointsMaterial({
      color: 0xff4d4d,
      size: 1.0,
      map: dotTexture,
      transparent: true,
      alphaTest: 0.01,
      depthWrite: false,
      opacity: 0.55,
      blending: THREE.AdditiveBlending
    });
    const dust = new THREE.Points(dustGeom, dustMat);
    scene.add(dust);

    function makeGlow(size = 768, c1 = '255,0,0', c2 = '150,0,0') {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(size / 2, size / 2, size * 0.05, size / 2, size / 2, size * 0.5);
      grad.addColorStop(0, 'rgba(' + c1 + ',0.8)');
      grad.addColorStop(0.5, 'rgba(' + c2 + ',0.3)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad; g.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeGlow(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    glow.scale.set(450, 450, 1);
    scene.add(glow);

    function ringTexture(size = 768) {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const g = c.getContext('2d'); g.translate(size / 2, size / 2);
      const r1 = size * 0.35, r2 = size * 0.48;
      const grd = g.createRadialGradient(0, 0, r1 * 0.6, 0, 0, r2);
      grd.addColorStop(0.0, 'rgba(255,100,100,1)');
      grd.addColorStop(0.3, 'rgba(255,0,0,1)');
      grd.addColorStop(0.7, 'rgba(150,0,0,0.8)');
      grd.addColorStop(1.0, 'rgba(0,0,0,0)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(0, 0, r2, 0, Math.PI * 2); g.arc(0, 0, r1, 0, Math.PI * 2, true); g.closePath(); g.fill();
      return new THREE.CanvasTexture(c);
    }
    const ring1 = new THREE.Mesh(new THREE.RingGeometry(80, 115, 128), new THREE.MeshBasicMaterial({ map: ringTexture(), transparent: true, side: THREE.DoubleSide, opacity: 0.32, blending: THREE.AdditiveBlending }));
    const ring2 = new THREE.Mesh(new THREE.RingGeometry(125, 155, 128), new THREE.MeshBasicMaterial({ map: ringTexture(), transparent: true, side: THREE.DoubleSide, opacity: 0.2, blending: THREE.AdditiveBlending }));
    ring1.rotation.x = ring2.rotation.x = Math.PI / 2;
    scene.add(ring1); scene.add(ring2);

    const WORDS = [];
    const baseWords = [
      'Te Amo ❤️',
      'Cada mes a tu lado es mágico 📅',
      'Eres mi refugio perfecto 🏡',
      'Mi corazón late por ti 🔥',
      'Un universo entero para nosotros 🌌',
      'Tú y yo, mi historia favorita 📖',
      'Mi presente y mi futuro ⏳',
      'Eres la mujer más guapa del universo 👑',
      'Tu sonrisa ilumina todo mi mundo ☀️',
      'Me pierdo en tu mirada preciosa 👀💖',
      'Eres la niña de mis ojos 🌹',
      'Qué suerte tengo de tenerte a mi lado 🍀',
      'Eres arte en movimiento 🎨',
      'Simplemente perfecta... ✨',
      'Me tienes locamente enamorado 😍',
      'Eres irresistiblemente sexy ❤️‍🔥',
      'Me encantas en todas tus versiones 💖',
      'Eres mi tentación favorita 🍎',
      'No puedo dejar de mirarte... 🔥',
      'Diosa de mi universo 🪐✨',
      'Estás preciosa hoy y siempre 💎',
      'Me vuelves loco de amor y deseo 💋'
    ];

    const PHRASE_REPEAT = isMobile ? 2 : 4;
    for (let i = 0; i < PHRASE_REPEAT; i++) { WORDS.push(...baseWords); }

    function makeTextTexture(text, color) {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 128;
      const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      let fontSize = 50;
      ctx.font = `700 ${fontSize}px "Playfair Display", serif`;
      while (ctx.measureText(text).width > c.width - 50 && fontSize > 26) {
        fontSize -= 2;
        ctx.font = `700 ${fontSize}px "Playfair Display", serif`;
      }
      ctx.fillStyle = '#ffffff'; ctx.shadowColor = color; ctx.shadowBlur = 25;
      ctx.fillText(text, c.width / 2, c.height / 2);
      return new THREE.CanvasTexture(c);
    }
    const COLORS = ['#ff3333', '#ff0000', '#cc0000', '#e60000', '#ff4d4d', '#b30000', '#ff1a1a'];
    const textGroup = new THREE.Group(); scene.add(textGroup);

    document.fonts.ready.then(() => {
      for (let i = 0; i < WORDS.length; i++) {
        const tex = makeTextTexture(WORDS[i], COLORS[i % COLORS.length]);
        const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
        const sp = new THREE.Sprite(mat);
        sp.scale.set(98, 12.25, 1);
        const phi = Math.acos(2 * Math.random() - 1); const theta = Math.random() * Math.PI * 2;
        const r = DUST_INNER_R + Math.random() * (DUST_OUTER_R - DUST_INNER_R - 30);
        sp.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
        sp.userData = { phi: phi, theta: theta, radius: r, speed: 0.001 + Math.random() * 0.001 };
        textGroup.add(sp);
      }
    });


    const misImagenes = [
      { url: './assets/1.jpeg', titulo: 'Nuestro inicio', desc: 'El día que todo comenzó a tener sentido.' },
      { url: './assets/2.jpeg', titulo: 'Una de nuestras primeras fotos', desc: 'Tu con tu bella y hermosa sonrisa, pero yo todo seria pero aun asi amandote demasiado.' },
      { url: './assets/3.jpeg', titulo: 'Uno de nuestros viajes', desc: 'Dandote un beso en un bello lugar.' },
      { url: './assets/4.jpeg', titulo: 'Juntos en cualquier lugar', desc: 'Buscando siempre la manera para poder estar a tu lado.' },
      { url: './assets/5.jpeg', titulo: 'Un beso mas....', desc: 'Otro beso mas porque para ti soy el mas facilote.' },
      { url: './assets/6.jpeg', titulo: 'Una tarde de café', desc: 'Si a ti te gusta el café, a mi me gusta estar a tu lado.' },
      { url: './assets/7.jpeg', titulo: 'Aqui con tu INGE....', desc: 'Uno de los dias mas felices de mi vida porque a mi lado esta la mujer que tanto amo.' },
      { url: './assets/8.jpeg', titulo: 'Otra fotito juntos', desc: 'Me fascina ver tu hermosa sonrisa.' },
      { url: './assets/9.jpeg', titulo: 'Otro beso mas...', desc: 'Es que neta por dios que me encanta estarte besando.' },
      { url: './assets/10.jpeg', titulo: 'Uffff con esa mirada', desc: 'Esa mirada hacia a mi es la mejor porque ufff me encantas demasiado.' },
      { url: './assets/11.jpeg', titulo: 'Tremanda sonrisa', desc: 'Si se me nota que sonrio, porque tu sonrisa es como un rayo de sol para mis dias.' },
      { url: './assets/15.jpeg', titulo: 'Visitando a la Virgencita', desc: 'Un dia muy espeacial porque en primera fue tu cumpleaños y porque puede ser esa primera vez en poder llevarte a la basilica, algo que es importante para ambos.' },
      { url: './assets/16.jpeg', titulo: 'Fotito con mi mujer', desc: 'Sin duda tengo a una hermosa y muy bonita mujer.' },
      { url: './assets/17.jpeg', titulo: 'Fotito check...', desc: 'Nunca voy a parar en decirte que tienes una bella sonrisa.' },
      { url: './assets/19.jpeg', titulo: 'De compras', desc: 'Comprando cositas para ambos, pero aqui me toco una gorrita para el viejo.' },
      { url: './assets/21.jpeg', titulo: 'Festejando el triunfo de mi mujer', desc: 'Un dia muy especial para la mujer de mis sueños.' },
      { url: './assets/23.jpeg', titulo: 'Orgulloso de mi novia', desc: 'Un dia muy especial para ti, porque fue un logro muy importante y sobre todo estoy muy orgulloso de todo lo que has logrado y de lo que vas a lograr a futuro.' },
      { url: './assets/signo.png', titulo: 'Futuros momentos', desc: 'Si lo encontraste significa que vamos a seguir teniendo nuevos momentos o aventuras juntos, por lo cual se estara actualizando.' },
    ];

    const imageGroup = new THREE.Group();
    scene.add(imageGroup);
    const texLoader = new THREE.TextureLoader();

    misImagenes.forEach((data) => {
      texLoader.load(data.url, (texture) => {
        const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sp = new THREE.Sprite(mat);
        sp.scale.set(35, 35, 1);

        const phi = Math.acos(2 * Math.random() - 1);
        const theta = Math.random() * Math.PI * 2;
        const r = DUST_INNER_R + Math.random() * (DUST_OUTER_R - DUST_INNER_R);
        sp.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));

        sp.userData = {
          phi: phi,
          theta: theta,
          radius: r,
          speed: 0.001 + Math.random() * 0.0015,
          titulo: data.titulo,
          desc: data.desc,
          url: data.url
        };
        imageGroup.add(sp);
      });
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const modal = document.getElementById('image-modal');

    function onClick(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(imageGroup.children);

      if (intersects.length > 0) {
        const obj = intersects[0].object;
        document.getElementById('modal-img').src = obj.userData.url;
        document.getElementById('modal-title').innerText = obj.userData.titulo;
        document.getElementById('modal-text').innerText = obj.userData.desc;
        modal.classList.remove('modal-hidden');
      }
    }

    document.getElementById('modal-close').onclick = () => modal.classList.add('modal-hidden');
    document.getElementById('modal-btn-close').onclick = () => modal.classList.add('modal-hidden');
    window.addEventListener('click', onClick);

    let isPointerDown = false;
    let startX = 0, startY = 0;
    let targetRotX = 0.2, targetRotY = 0;
    let velX = 0, velY = 0;

    function onDown(e) {
      isPointerDown = true;
      velX = 0; velY = 0;
      const t = e.touches ? e.touches[0] : e;
      startX = t.clientX;
      startY = t.clientY;
    }

    function onMove(e) {
      if (!isPointerDown) return;
      if (e.touches && e.touches.length > 1) return;
      const t = e.touches ? e.touches[0] : e;
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;

      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
        const sensX = (Math.PI * 1.5) / innerWidth;
        const sensY = (Math.PI * 0.8) / innerHeight;

        velY = -dx * sensX;
        velX = dy * sensY;

        targetRotY += velY;
        targetRotX = Math.max(-1.25, Math.min(1.25, targetRotX + velX));

        startX = t.clientX;
        startY = t.clientY;
      }
    }

    function onUp() {
      isPointerDown = false;
    }

    const dom = renderer.domElement;
    dom.addEventListener('mousedown', onDown);
    dom.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);

    dom.addEventListener('touchstart', onDown, { passive: true });
    dom.addEventListener('touchmove', onMove, { passive: true });
    window.addEventListener('touchend', (e) => {
      if (!e.touches || e.touches.length === 0) {
        onUp();
      } else {
        const t = e.touches[0];
        startX = t.clientX;
        startY = t.clientY;
      }
    }, { passive: true });

    addEventListener('wheel', (e) => {
      targetDist += e.deltaY * 0.25;
      targetDist = Math.max(180, Math.min(1100, targetDist));
    }, { passive: true });

    let pinchDist = null;

    function getPinchDist(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        pinchDist = getPinchDist(e.touches);
        isPointerDown = false;
      }
    }, { passive: true });

    addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        const newDist = getPinchDist(e.touches);
        if (pinchDist !== null) {
          const delta = pinchDist - newDist;
          targetDist += delta * 0.85;
          targetDist = Math.max(180, Math.min(1100, targetDist));
        }
        pinchDist = newDist;
      } else {
        if (pinchDist !== null) {
          pinchDist = null;
          if (e.touches.length === 1) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            isPointerDown = true;
          }
        }
      }
    }, { passive: true });

    addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        pinchDist = null;
      }
    }, { passive: true });

    let t = 0;
    const INERTIA_DECAY = 0.88;

    function tick() {
      requestAnimationFrame(tick);
      t += 0.01;

      if (!isPointerDown) {
        velX *= INERTIA_DECAY;
        velY *= INERTIA_DECAY;
        targetRotX = Math.max(-1.25, Math.min(1.25, targetRotX + velX));
        targetRotY += velY;
      }

      rotX += (targetRotX - rotX) * 0.12;
      rotY += (targetRotY - rotY) * 0.12;

      ring1.rotation.z += 0.002;
      ring2.rotation.z -= 0.0015;
      spiral.rotation.y -= 0.0045;
      dust.rotation.y += 0.0006;

      glow.scale.set(450 * (1 + Math.sin(t * 0.4) * 0.03), 450 * (1 + Math.sin(t * 0.4) * 0.03), 1);

      const s = 1.0 + 0.05 * Math.sin(t * 4);
      heart.scale.set(s, s, s);

      textGroup.children.forEach(sp => {
        sp.material.opacity = 0.8 + 0.2 * Math.sin(t * 2);
        sp.userData.theta += sp.userData.speed;
        sp.position.x = sp.userData.radius * Math.sin(sp.userData.phi) * Math.cos(sp.userData.theta);
        sp.position.z = sp.userData.radius * Math.sin(sp.userData.phi) * Math.sin(sp.userData.theta);
      });

      imageGroup.children.forEach(sp => {
        sp.material.opacity = 0.85 + 0.15 * Math.sin(t * 1.5);
        sp.userData.theta += sp.userData.speed;
        sp.position.x = sp.userData.radius * Math.sin(sp.userData.phi) * Math.cos(sp.userData.theta);
        sp.position.z = sp.userData.radius * Math.sin(sp.userData.phi) * Math.sin(sp.userData.theta);
      });

      currentDist += (targetDist - currentDist) * 0.06;

      const camX = currentDist * Math.cos(rotX) * Math.sin(rotY);
      const camY = currentDist * Math.sin(rotX);
      const camZ = currentDist * Math.cos(rotX) * Math.cos(rotY);
      camera.position.set(camX, camY, camZ);
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }
    tick();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

</body>

</html>
